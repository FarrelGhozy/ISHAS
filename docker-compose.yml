# ISHAS — Docker Compose. Environment diambil dari `.env` root.
# Dev dan prod memakai port host yang sama (WEB_PORT), jadi jalankan bergantian:
#   docker compose --profile dev up --build    # hot reload (bun run dev)
#   docker compose --profile prod up --build   # hasil build statis via nginx
# Verifikasi interpolasi: `docker compose config`

services:
  web-dev:
    build:
      context: ./apps/web
      target: development
      args:
        BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1}
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${WEB_PORT:-3003}:3003"
    volumes:
      - ./apps/web:/app
      - web-dev-modules:/app/node_modules
      # Direktori generated diisolasi di volume agar container (root)
      # tidak menulis file milik root ke bind mount host.
      # Tanpa ini, `bun run dev` lokal gagal EACCES setelah `compose up`
      # karena `.react-router/` menjadi milik root.
      - web-dev-router:/app/.react-router
      - web-dev-build:/app/build
    profiles:
      - dev

  web-prod:
    build:
      context: ./apps/web
      target: production
      args:
        BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG:-22-slim}
        NGINX_IMAGE_TAG: ${NGINX_IMAGE_TAG:-alpine}
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${WEB_PORT:-3003}:80"
    profiles:
      - prod

volumes:
  web-dev-modules:
  web-dev-router:
  web-dev-build:
