# ISHAS — Docker Compose. SEMUA environment diambil dari `.env` root (terpusat).
# Ubah nilai di `.env`, jangan hardcode di sini.
#
# Ringkasan service:
#   db       = database MySQL (backend)
#   api      = BACKEND mode ngoding (watch) — demo-login aktif
#   api-prod = BACKEND mode rilis (NODE_ENV=production) — demo-login mati
#   web-dev  = FRONTEND mode ngoding (hot reload)
#   web-prod = FRONTEND mode rilis (nginx statis, build VITE_ dari .env)
#
# Dev dan prod memakai port host yang sama (WEB_PORT), jadi jalankan bergantian.
# Profile `dev` menyalakan SEMUA yang dibutuhkan sekaligus: db + api + web-dev.
# Profile `prod` menyalakan db + api-prod + web-prod (login email+sandi).
#   docker compose --profile dev up --build    # db + backend + frontend (localhost:3003)
#   docker compose --profile prod up --build   # frontend hasil build statis + backend rilis
# Verifikasi interpolasi: `docker compose config`

# Konfigurasi bersama service backend (dipakai `api` dan `api-prod`).
x-api-build: &api-build
  # Context ROOT repo: seed backend mengimpor `apps/web/mocks/` (lihat Dockerfile).
  context: .
  dockerfile: apps/api/Dockerfile
  args:
    BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1}

x-api-env: &api-env
  # Override `.env` lokal: di dalam Compose, MySQL adalah service `db`.
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-ishas}
  DB_USER: ${DB_USER:-ishas}
  DB_PASSWORD: ${DB_PASSWORD:-ishas}
  API_PORT: ${API_PORT:-3004}

services:
  db:
    image: mysql:${MYSQL_IMAGE_TAG:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ishas}
      MYSQL_USER: ${DB_USER:-ishas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ishas}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # `db` ikut profile `dev` (agar `--profile dev` menyalakan semuanya sekaligus),
    # `api` (untuk menjalankan backend+migrasi saja), dan `prod` (agar web-prod
    # dapat meneruskan `/api` ke backend yang butuh database).
    profiles:
      - dev
      - api
      - prod

  # BACKEND mode ngoding (watch). Diakses dari frontend lewat proxy same-origin
  # `/api`. Endpoint demo-login aktif di sini (NODE_ENV=development).
  api:
    build: *api-build
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *api-env
      NODE_ENV: development
      # Kartu demo aktif di mode ngoding (diabaikan bila diisi di `.env`).
      DEMO_AUTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3004}:${API_PORT:-3004}"
    working_dir: /app/apps/api
    volumes:
      # Kode backend di-bind agar `bun run dev` (watch) memuat perubahan tanpa rebuild.
      # (Seed tetap membaca `apps/web/mocks/` dari image, bukan dari bind ini.)
      - ./apps/api:/app/apps/api
      - api-modules:/app/apps/api/node_modules
      # Blob unggahan (bukti/denah/PDF) disimpan di named volume, bukan bind
      # mount. Container `api` berjalan sebagai root, sehingga bind mount akan
      # membuat file milik root di host dan membuat `bun test`/dev lokal EACCES.
      # Named volume menjaga `apps/api/storage` host tetap milik pengguna.
      - api-storage:/app/apps/api/storage
    profiles:
      - dev
      - api

  # BACKEND mode rilis. `NODE_ENV=production` mematikan `/auth/demo-login` dan
  # fallback `X-Demo-Account`; login hanya lewat cookie sesi (email + sandi).
  # Kode diambil dari image (tanpa bind mount) dan dijalankan tanpa watch.
  api-prod:
    build: *api-build
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *api-env
      NODE_ENV: production
      # Prototipe lokal via http://localhost: biarkan false. Set `COOKIE_SECURE=true`
      # di `.env` bila sudah di balik HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Matikan kartu/endpoint demo di rilis; halaman login memakai form sandi.
      # (Dipaksa false agar nilai `.env` tidak mengaktifkan kembali di production.)
      DEMO_AUTH_ENABLED: "false"
    command: ["bun", "run", "start"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3004}:${API_PORT:-3004}"
    working_dir: /app/apps/api
    volumes:
      # Blob unggahan disimpan persisten; kode tetap dari image (rilis).
      - api-storage:/app/apps/api/storage
    profiles:
      - prod

  web-dev:
    build:
      context: ./apps/web
      target: development
      args:
        BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1}
        WEB_DEV_CONTAINER_PORT: ${WEB_DEV_CONTAINER_PORT:-3003}
    env_file:
      - path: ./.env
        required: false
    environment:
      # Di dalam Compose, backend adalah service `api` (nama service = hostname).
      # Jadi proxy `/api` diarahkan ke `api`, bukan host gateway.
      PORT: ${WEB_DEV_CONTAINER_PORT:-3003}
      API_PROXY_HOST: api
      API_PORT: ${API_PORT:-3004}
    ports:
      - "${WEB_PORT:-3003}:${WEB_DEV_CONTAINER_PORT:-3003}"
    volumes:
      - ./apps/web:/app
      - web-dev-modules:/app/node_modules
      # Direktori generated diisolasi di volume agar container (root)
      # tidak menulis file milik root ke bind mount host.
      # Tanpa ini, `bun run dev` lokal gagal EACCES setelah `compose up`
      # karena `.react-router/` menjadi milik root.
      - web-dev-router:/app/.react-router
      - web-dev-build:/app/build
    depends_on:
      - api
    profiles:
      - dev

  web-prod:
    build:
      context: ./apps/web
      target: production
      args:
        BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1}
        NODE_IMAGE_TAG: ${NODE_IMAGE_TAG:-22-slim}
        NGINX_IMAGE_TAG: ${NGINX_IMAGE_TAG:-alpine}
        WEB_PROD_CONTAINER_PORT: ${WEB_PROD_CONTAINER_PORT:-80}
        # Vite menanam nilai ini saat build; build context `apps/web` tidak
        # memuat `.env` root, jadi harus diteruskan eksplisit sebagai build arg.
        VITE_USE_BACKEND: ${VITE_USE_BACKEND:-false}
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    env_file:
      - path: ./.env
        required: false
    environment:
      # nginx prod meneruskan `/api` ke service `api-prod` (nama service = hostname).
      API_HOST: api-prod
      API_PORT: ${API_PORT:-3004}
    ports:
      - "${WEB_PORT:-3003}:${WEB_PROD_CONTAINER_PORT:-80}"
    depends_on:
      - api-prod
    profiles:
      - prod

volumes:
  db-data:
  api-modules:
  api-storage:
  web-dev-modules:
  web-dev-router:
  web-dev-build:
