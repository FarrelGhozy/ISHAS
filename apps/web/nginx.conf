# ISHAS web — nginx untuk hasil build SPA statis (React Router ssr: false).
# Fallback ke index.html agar route langsung (/hasil, /lapor, ...) tetap termuat.
# Port diambil dari `.env` (WEB_PROD_CONTAINER_PORT) lewat placeholder
# `${WEB_PROD_CONTAINER_PORT}` yang di-substitusi envsubst Dockerfile saat start.
server {
  listen ${WEB_PROD_CONTAINER_PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
