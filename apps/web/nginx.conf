# ISHAS web — nginx untuk hasil build SPA statis (React Router ssr: false).
# Fallback ke index.html agar route langsung (/hasil, /lapor, ...) tetap termuat.
# Port diambil dari `.env` (WEB_PROD_CONTAINER_PORT) lewat placeholder
# `${WEB_PROD_CONTAINER_PORT}` yang di-substitusi envsubst Dockerfile saat start.
# Nama host/port backend (`${API_HOST}`/`${API_PORT}`) juga di-substitusi envsubst:
# diisi dari service `api` pada docker-compose.yml.

server {
  listen ${WEB_PROD_CONTAINER_PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA shell: jangan di-cache (aset ber-hash sudah immutable di /assets/), agar
  # rilis/deploy baru langsung terpakai di balik CDN Cloudflare.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Teruskan API ke backend agar `VITE_USE_BACKEND=true` berfungsi di prod
  # (sebelumnya /api jatuh ke fallback SPA → respons HTML, bukan JSON).
  location /api/ {
    proxy_pass http://${API_HOST}:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Naikkan batas unggah bukti/denah/dokumen (blob backend).
    client_max_body_size 25m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
