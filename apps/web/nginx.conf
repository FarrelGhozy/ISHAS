# ISHAS web — nginx untuk hasil build SPA statis (React Router ssr: false).
# Fallback ke index.html agar route langsung (/hasil, /lapor, ...) tetap termuat.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
